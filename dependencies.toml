[compatibility]
python = ">=3.11,<3.15"
hermes = ">=0.21.5"
verified-stable = "v2026.9.24"
verified-main = "54bc5e509c985f37265c3d416bd2c64b10fc77ba"
verified-on = "2026-10-03"

[plugin]
# The plugin's mandatory imports come from Python's standard library and Hermes.
# Provider SDKs remain optional and are installed through the matching Hermes extra.
direct-requirements = []

[extras.exa]
requirements = ["exa-py==2.10.2"]

[extras.firecrawl]
requirements = ["firecrawl-py==4.17.0"]

[extras.parallel-web]
requirements = ["parallel-web==0.4.2"]

[extras.mcp]
requirements = [
  "mcp==2.0.0",
  "httpx2==2.7.0",
  "starlette==1.3.1",
]

[extras.ddgs]
# Hermes v2026.9.24 contains the provider but not this PM extra. Hermes main
# declares it; require it in the main CI lane while allowing stable to omit it.
allow-missing = true
requirements = ["ddgs==9.16.0"]
