name: Hermes compatibility

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "plugin.yaml"
      - "tests/**"
      - ".github/workflows/hermes-compat.yml"
  pull_request:
    paths:
      - "*.py"
      - "plugin.yaml"
      - "tests/**"
      - ".github/workflows/hermes-compat.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Hermes latest stable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out this plugin
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Resolve Hermes ref
        id: hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest \
            | jq -er '.tag_name')
          if [[ ! "$ref" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            printf 'Unexpected Hermes release tag: %s\n' "$ref" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'Testing Hermes ref: %s\n' "$ref"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install latest stable Hermes
        shell: bash
        env:
          HERMES_REF: ${{ steps.hermes.outputs.ref }}
        run: |
          set -euo pipefail
          pip install "git+https://github.com/NousResearch/hermes-agent@${HERMES_REF}"

      - name: Validate plugin
        run: hermes plugins validate "$GITHUB_WORKSPACE" --json

  main:
    name: Hermes main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out this plugin
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Validate with Hermes main
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
        with:
          path: .
          hermes-ref: main
